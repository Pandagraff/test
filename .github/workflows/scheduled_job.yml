name: Tester
on:
  schedule:
    - cron: '* * * * *' # Runs every day at 09:00 UTC
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run script
        run: python script.py
